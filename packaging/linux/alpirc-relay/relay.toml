# Réglages du relais d'AlpIRC (alpirc-relay, ADR 0009) — installé dans /etc/alpirc-relay/relay.toml.
# AlpIRC relay settings — installed as /etc/alpirc-relay/relay.toml.
#
# Ce fichier est lu au démarrage du service. Après une modification :
#   sudo systemctl restart alpirc-relay
# Il peut contenir des mots de passe : il n'est lisible que par root et par le relais (groupe alpirc-relay).
# Une version modifiée ici est gardée lors des mises à jour du paquet.
#
# Les options sont décrites dans la documentation du relais (crates/relay du dépôt
# https://github.com/Guiwald/alpirc). Les données (historique, certificats) vont dans /var/lib/alpirc-relay.
#
# Premiers pas / getting started :
#   1. sudo -u alpirc-relay alpirc-relay --config /etc/alpirc-relay/relay.toml --data /var/lib/alpirc-relay --init
#      → crée le certificat du relais et affiche son empreinte SHA-256 (à entrer dans AlpIRC, qui la retient).
#        creates the relay's certificate and prints its SHA-256 fingerprint (AlpIRC pins it).
#   2. sudo alpirc-relay --config /etc/alpirc-relay/relay.toml --add-user guillaume
#      → demande un mot de passe et ajoute l'utilisateur à la fin de ce fichier (empreinte argon2id) ;
#        « --passwd guillaume » le change. Asks for a password and appends the user to this file.
#   3. Ajouter ses réseaux sous l'utilisateur (modèle plus bas), ou depuis un client qui sait faire
#      (BOUNCER ADDNETWORK de soju). Add networks below the user, or from a soju-aware client.
#   4. sudo systemctl enable --now alpirc-relay
#
# Dans AlpIRC : un réseau dont le serveur est ce relais (port 6697, TLS, certificat « épinglé » avec
# l'empreinte), mot de passe du serveur « utilisateur:mot-de-passe ». AlpIRC ouvre ensuite une fenêtre Status
# par réseau du relais. Autres clients : mot de passe « utilisateur/réseau:mot-de-passe », ou SASL PLAIN.

# Nom du relais vu par les clients (source de ses messages).
# Relay name as seen by clients.
#server_name = "alpirc.relay"

# Message du jour montré aux appareils. / Message of the day.
#motd = "Bienvenue sur le relais d'AlpIRC."

# Certificat et clé TLS (PEM). Chemins relatifs au dossier de données ; par défaut relay.crt et relay.key,
# créés par --init (ou au premier démarrage) : certificat autosigné ECDSA P-256 valable 10 ans.
# Avec un vrai nom de domaine, on peut y mettre un certificat Let's Encrypt (fullchain.pem, privkey.pem).
# TLS certificate and key (PEM), relative to the data folder; generated by --init when missing.
#cert = "relay.crt"
#key = "relay.key"
# Noms mis dans le certificat généré (facultatif : AlpIRC épingle l'empreinte).
#cert_names = ["relais.example.org"]

# Écoutes. TLS par défaut sur le port 6697.
# Listeners. TLS on port 6697 by default.
[[listen]]
address = "0.0.0.0:6697"
tls = true

# Écoute en clair, seulement pour cette machine (essais, clients locaux) :
# Plain-text listener, for this machine only:
#[[listen]]
#address = "127.0.0.1:6667"
#tls = false

[history]
# Historique des canaux et des privés, pour le rattrapage (CHATHISTORY).
# Channel and private message history, for catching up (CHATHISTORY).
enabled = true
# Jours gardés (0 : sans limite). / Days kept (0: forever).
retention_days = 365
# Lignes gardées au plus par canal ou privé (0 : sans limite). / Max lines per channel or query (0: no limit).
max_lines_per_target = 100000

[away]
# Se mettre « absent » sur un réseau quand aucun appareil n'y est connecté, et revenir dès qu'un appareil
# se connecte. / Set away when no device is attached to a network.
auto_away = true
message = "Away (no device connected)"

[upstream]
# Anti-flood vers les réseaux : une rafale de flood_burst lignes, puis une ligne toutes les flood_interval_ms.
# Flood protection towards the networks.
flood_burst = 10
flood_interval_ms = 1500
# Reconnexion : délai qui double à chaque échec, de reconnect_min_secs à reconnect_max_secs.
# Reconnection delay, doubling from min to max.
reconnect_min_secs = 10
reconnect_max_secs = 300
# PING après ping_interval_secs de silence ; connexion tenue pour morte après ping_timeout_secs.
ping_interval_secs = 90
ping_timeout_secs = 240

# Utilisateurs : ajoutés par « alpirc-relay --add-user <nom> », à la fin de ce fichier ; leurs réseaux se
# mettent à la suite de chaque [[users]].
# Users: appended at the end of this file by "alpirc-relay --add-user <name>"; their networks go below them.
#
# Modèle d'un utilisateur et de ses réseaux (mêmes champs que les réseaux d'AlpIRC) :
# Example of a user and their networks (same fields as AlpIRC networks):
#
#[[users]]
#name = "guillaume"
#password_hash = "$argon2id$v=19$m=19456,t=2,p=1$…"   # écrit par --add-user / --passwd
#
#[[users.networks]]
#name = "Undernet"
#nick = "Guiwald"
#alt_nick = "Guiwald_"
#realname = "Guillaume"
#username = "guiwald"
#encoding = "auto"                  # auto (UTF-8, repli Windows-1252), utf-8 ou latin1
#channels = ["#lyon", "#grenoble"]  # rejoints à chaque connexion (« #canal clé » pour une clé)
#perform = ["MODE Guiwald +x"]      # commandes IRC envoyées après la connexion
#
## Compte X d'Undernet (Login on Connect) :
#[users.networks.undernet_x]
#username = "guiwald"
#password = "…"
#hide_host = true
#require_x = true
#
#[[users.networks.servers]]
#host = "irc.undernet.org"
#port = 6667
#tls = false
#
#[[users.networks]]
#name = "Libera.Chat"
#nick = "Guiwald"
#channels = ["#alpirc-test"]
#
## SASL (PLAIN, SCRAM-SHA-256, EXTERNAL avec client_cert) :
#[users.networks.sasl]
#mechanism = "SCRAM-SHA-256"
#account = "guiwald"
#password = "…"
#
#[[users.networks.servers]]
#host = "irc.libera.chat"
#port = 6697
#tls = true
#verify = "full"                    # full, accept-invalid ou pinned (avec fingerprint = "…")
