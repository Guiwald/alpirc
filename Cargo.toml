[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/core",
    "crates/net",
    "crates/script",
    "crates/ui",
    "crates/relay",
    "crates/shell",
    "app/desktop",
    "app/android",
    "xtask",
]
default-members = ["app/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Guiwald/alpirc"
authors = ["Guiwald"]
rust-version = "1.89"

[workspace.dependencies]
alpirc-proto = { path = "crates/proto" }
alpirc-core = { path = "crates/core" }
alpirc-net = { path = "crates/net" }
alpirc-script = { path = "crates/script" }
alpirc-ui = { path = "crates/ui" }
alpirc-relay = { path = "crates/relay" }
alpirc-shell = { path = "crates/shell" }

thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1"
encoding_rs = "0.8"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.3"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = "0.4"
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
png = "0.18"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[profile.dev]
opt-level = 1
# Numéros de ligne dans les traces, sans le reste des infos de débogage (target/ bien plus léger).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
